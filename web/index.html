<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <!-- Alamat lama dialihkan ke domain resmi sebelum aplikasi dimuat (docs/DECISIONS.md, "Sumber daya Cloudflare"). Hanya alamat produksi
         lama persis: alamat pratinjau (<hash>.teach-hris-spa.pages.dev) dan localhost tidak ikut. Yang dialihkan hanya halaman; API di
         alamat lama tetap melayani karena Worker cron masih memanggilnya. -->
    <script>
      if (location.hostname === 'teach-hris-spa.pages.dev') location.replace('https://app.hrteach.site' + location.pathname + location.search + location.hash);
    </script>
    <!-- viewport-fit=cover: konten boleh sampai tepi layar; inset aman diatur lewat env(safe-area-inset-*). Zoom tidak dimatikan (aksesibilitas). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>HRIS TEACH</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
